<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title>RUDA Fashion showroom</title>
  <desc>Default fashion showroom image for RUDA merchants</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset=".55" stop-color="#5b5148"/>
      <stop offset="1" stop-color="#c2b3a3"/>
    </linearGradient>
    <pattern id="lines" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M0 0V80" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#lines)"/>
  <text x="100" y="710" fill="#fff" font-family="Georgia,serif" font-size="86" font-weight="700">RUDA</text>
  <text x="106" y="770" fill="#fff" fill-opacity=".8" font-family="Arial,sans-serif" font-size="24" letter-spacing="8">FASHION WHOLESALE</text>
</svg>
